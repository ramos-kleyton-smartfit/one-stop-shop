<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Fit - Academia</title>
  <link rel="preload" href="home.svg" as="image">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Tela 1: Home -->
    <div id="screen-home" class="screen active">
      <img src="home.svg" class="screen-bg" alt="Home">
      <div class="clickable-story" data-screen="story-aline"></div>
    </div>

    <!-- Tela 2: Story Aline -->
    <div id="screen-story-aline" class="screen">
      <img src="story-aline.svg" class="screen-bg" alt="Story Aline">
       <div class="click-advance" data-screen="ad"></div>
    </div>

    <!-- Tela 3: Ad AERA -->
    <div id="screen-ad" class="screen">
      <img src="ad-aera.svg" class="screen-bg" alt="Ad AERA">
      <video class="video-aera" autoplay loop muted playsinline preload="none">
        <source src="aera.mp4" type="video/mp4">
        <source src="aera.mov" type="video/quicktime">
      </video>
      <a href="#comprar" class="btn-comprar-aula-2" data-screen="buy">Comprar Aula</a>
      <a href="#comprar" class="btn-comprar-aula-aera" data-screen="buy">Comprar Aula</a>
      <div class="click-advance" data-screen="story-vitor"></div>
    </div>

    <!-- Tela 4: Story Vitor -->
    <div id="screen-story-vitor" class="screen">
      <img src="story-vitor.svg" class="screen-bg" alt="Story Vitor">
       <a href="#comprar" class="btn-comprar-aula" data-screen="buy">Comprar Aula</a>
    </div>

    <!-- Tela 5: Comprar Aula -->
    <div id="screen-buy" class="screen">
      <img src="comprar.svg" class="screen-bg" alt="Comprar Aula">
      <!-- Hotspots invisíveis para controles -->
      <div class="hotspot-qty-minus" data-action="minus"></div>
      <div class="hotspot-qty-plus" data-action="plus"></div>
      <div class="hotspot-btn-comprar" data-action="buy"></div>
      <div class="click-advance" data-screen="final"></div>
    </div>

    <!-- Tela 6: Final (12.svg) -->
    <div id="screen-final" class="screen">
      <img src="12.svg" class="screen-bg" alt="Final">
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
